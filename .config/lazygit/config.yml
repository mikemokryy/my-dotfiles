customCommands:
  - key: "C"
    command: "git czg ai -N=3"
    description: "commit with AI commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
  - key: "c"
    command: "git czg"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  mouseEvents: false
