# tmux configuration
#
# Modular layout: bindings, plugin options, macOS tweaks and theme live in
# separate files. Machine-local overrides go in tmux-private.conf, which is
# optional and sourced last.

#### terminal

set -g default-terminal "tmux-256color"

# Declare truecolor support the modern way (tmux >= 3.2). Reset first so
# `prefix r` cannot duplicate the entry.
set -su terminal-features
set -as terminal-features ',*:RGB'

set -g allow-passthrough on

#### action key

unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### basic settings

set-option -g history-limit 8192
set -s set-clipboard on
set-option -g mouse on
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

set -sg escape-time 10

# Start windows and panes at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Follow the terminal's title and keep window numbers dense.
set -g set-titles on
set -g set-titles-string "#T"
set -g renumber-windows on

#### plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'mikemokryy/tmux-opencode-hatch'

#### load order

# Plugin options must exist before tpm runs the plugins below.
source ~/.config/tmux/utility.conf
source ~/.config/tmux/bindings.conf
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"
source ~/.config/tmux/theme.conf
source -q ~/.config/tmux/tmux-private.conf

run '~/.config/tmux/plugins/tpm/tpm'
