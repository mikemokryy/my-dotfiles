# macOS-only settings. Sourced from tmux.conf when uname is Darwin.

# System clipboard.
set -s copy-command 'pbcopy'

# Terminal capabilities the outer terminal supports. Reset first so reloading
# cannot duplicate entries; this is the one place they are appended.
set -su terminal-overrides
# Italic support.
set -as terminal-overrides ',xterm*:sitm=\E[3m'
# Undercurl support.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Underscore colours (needs tmux 3.0).
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
