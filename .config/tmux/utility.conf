# tmux-opencode-hatch
#
# Only overrides live here; everything else uses the plugin defaults
# (launch y, list u, command opencode, popup 90%, sort recent).

# Keep the session-* sessions created before the switch.
set -g @opencode_session_prefix 'session-'

# Picker navigation: vim-style nav mode, x kills, enter jumps.
set -g @opencode_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(\$OPENCODE_PICKER --delete {5} {3})+reload(sleep 0.3; \$OPENCODE_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"
